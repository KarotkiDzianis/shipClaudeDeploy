# platform/ship/registry/targets.yml
#
# Deployment targets. A target names a self-hosted runner pool + the
# release layout it enforces + which projects it will accept a deploy for.
# The runner itself validates repo/project-slug/target/release-root/
# service against THIS file at deploy time (never trusts the calling
# workflow's own inputs alone) -- see docs/SHIP_SECURITY.md.
#
# STATUS (2026-09-13): `main-vm` is the same real prod VM TradePulse and
# another bot already run on (Dzianis's explicit decision -- one machine,
# isolated per-service systemd units, restart is always scoped to the
# ONE named service, never the VM itself). `ship-sandbox` is the first
# project actually onboarded, specifically to prove the pipeline
# mechanically before any real project goes through it (see that
# project's own CLAUDE.md). tradepulse/stroytender-by stay listed as
# design placeholders -- their own registry entries still refuse (see
# projects.yml, `repo: "TBD"`) until each is a separate, later, explicit
# decision.

main-vm:
  runner_labels:
    - self-hosted
    - linux
    - ship-prod
  release_root: /srv/apps
  allowed_projects:
    - ship-sandbox
    - tradepulse
    - stroytender-by
