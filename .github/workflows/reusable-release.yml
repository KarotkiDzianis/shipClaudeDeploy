name: Ship Reusable Release

# Enqueues a "please announce this release for Telegram approval"
# request (§14/§19/§20) -- the actual Telegram call is made by the
# approval daemon (telegram/approval_bot/daemon.py), a separate
# long-running systemd service on the SAME self-hosted VM, not by this
# job. That's why this runs on [self-hosted] rather than GitHub-hosted:
# the request is a JSON file dropped where the daemon can see it,
# because a human's decision is asynchronous and can arrive long after
# this job itself has finished. It also means the real bot token is
# NEVER a GitHub secret -- only the daemon's own systemd environment
# holds it (see SHIP_SECURITY.md).
#
# Each project is its own separate git repo (see reusable-ci.yml's own
# comment) -- platform/ship is checked out into its own subdirectory at
# a pinned commit, same pattern as reusable-deploy.yml.

env:
  SHIP_REF: 408dc3bb833f8c7e2cc01790708ba5a5ac099635

on:
  workflow_call:
    inputs:
      project_slug:
        required: true
        type: string
      git_sha:
        required: true
        type: string
      artifact_sha256:
        required: true
        type: string
      change_summary:
        required: false
        type: string
        default: ""

jobs:
  release-ready:
    runs-on: [self-hosted, linux, ship-prod]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KarotkiDzianis/shipClaudeDeploy
          ref: ${{ env.SHIP_REF }}
          path: platform/ship

      - name: Install Ship's own Python deps (system python3, not actions/setup-python)
        run: |
          # Same fix as reusable-deploy.yml: actions/setup-python has no
          # prebuilt binary for this VM's OS on a self-hosted runner.
          pip3 install --user --break-system-packages -r platform/ship/requirements.txt
          echo "PYTHONPATH=$(python3 -m site --user-site):$GITHUB_WORKSPACE/platform/ship" >> "$GITHUB_ENV"

      - name: Enqueue the approval request for the daemon to announce
        run: |
          python3 -m shiplib.release_ready_cli \
            --project "${{ inputs.project_slug }}" \
            --repo "${{ github.repository }}" \
            --git-sha "${{ inputs.git_sha }}" \
            --artifact-sha256 "${{ inputs.artifact_sha256 }}" \
            --change-summary "${{ inputs.change_summary }}"
