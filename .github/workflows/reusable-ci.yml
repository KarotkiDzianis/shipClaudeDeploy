name: Ship Reusable CI

# Called by a project's own thin .github/workflows/ship.yml via
# `uses: <org>/ship@<pinned-sha>/.github/workflows/reusable-ci.yml`.
# Runs on GitHub-hosted runners only -- PR/untrusted code never touches
# the self-hosted deploy runner (§11/§26 of the Ship spec).
#
# Each project lives in its OWN separate git repository (not a shared
# monorepo) -- `actions/checkout@v4` with no `path:` therefore checks the
# CALLING project out at the job's workspace root, so `project.yml` and
# `scripts/ship/*` are always at `./`. `platform/ship` itself is a
# SEPARATE repo (KarotkiDzianis/shipClaudeDeploy) and is checked out into
# a `platform/ship` subdirectory below, pinned to the exact commit the
# calling project's own ship.yml is pinned to -- keep this ref in sync
# with that pin whenever it's bumped (see ship.yml's own comment).
#
# STATUS (2026-09-13): exercised for the first time against a real
# repository (ship-sandbox) as part of Ship V0's first live E2E test.

env:
  SHIP_REF: 408dc3bb833f8c7e2cc01790708ba5a5ac099635

on:
  workflow_call:
    inputs:
      project_slug:
        required: true
        type: string
    outputs:
      artifact_sha256:
        value: ${{ jobs.build.outputs.artifact_sha256 }}
      git_sha:
        value: ${{ jobs.build.outputs.git_sha }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KarotkiDzianis/shipClaudeDeploy
          ref: ${{ env.SHIP_REF }}
          path: platform/ship
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ship
        run: pip install -r platform/ship/requirements.txt
      - name: Confirm this project slug is registered in the central registry
        run: |
          PYTHONPATH=platform/ship python3 -c "
          from shiplib.registry import load_projects
          projects = load_projects()
          assert '${{ inputs.project_slug }}' in projects, \
              \"'${{ inputs.project_slug }}' is not in registry/projects.yml -- refusing\"
          print('project is registered')
          "
      - name: Validate project.yml against the schema
        run: |
          PYTHONPATH=platform/ship python3 -c "
          from shiplib.schema import load_project_config
          load_project_config('project.yml')
          print('project.yml is valid')
          "

  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run this project's own tests
        run: bash scripts/ship/test

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      artifact_sha256: ${{ steps.hash.outputs.sha256 }}
      git_sha: ${{ steps.sha.outputs.git_sha }}
    steps:
      - uses: actions/checkout@v4
      - id: sha
        run: echo "git_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build
        run: bash scripts/ship/build
      - name: Package (tar the build output as artifact.tar.gz)
        run: tar czf artifact.tar.gz -C build .
      - id: hash
        run: echo "sha256=$(sha256sum artifact.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ship-artifact-${{ inputs.project_slug }}
          path: artifact.tar.gz
          retention-days: 30
