name: Ship Reusable Deploy

# Runs ONLY on the self-hosted deploy runner (§26/§27) -- never on a
# GitHub-hosted runner, never for a PR/untrusted-code job. Triggered only
# after an approval decision has been recorded for this exact git_sha
# (Telegram, or the central registry's own `approval: automatic` opt-in
# -- see deploy/run_deploy_cli.py).
#
# Each project is its own separate git repo (see reusable-ci.yml's own
# comment on this) -- the default checkout below puts the CALLING
# project at the workspace root (so `scripts/ship/health` resolves), and
# platform/ship (a separate repo, KarotkiDzianis/shipClaudeDeploy) is
# checked out into a `platform/ship` subdirectory, pinned to the same
# commit the calling project's ship.yml itself pins to.
#
# Every step below re-validates against the central registry
# (shiplib.registry.authorize_deploy) rather than trusting these workflow
# inputs on their own -- §27 "server side allowlist": even a compromised
# project.yml or a forged workflow input cannot grant a deploy the
# registry itself doesn't authorize.

env:
  SHIP_REF: 408dc3b

on:
  workflow_call:
    inputs:
      project_slug:
        required: true
        type: string
      git_sha:
        required: true
        type: string
      artifact_sha256:
        required: true
        type: string
      release_id:
        required: true
        type: string
    secrets:
      SHIP_TELEGRAM_BOT_TOKEN:
        required: false
      SHIP_TELEGRAM_CHAT_ID:
        required: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, ship-prod]
    steps:
      - name: Checkout this project's own repo (scripts/ship/health lives here)
        uses: actions/checkout@v4

      - name: Checkout platform/ship (pinned commit, separate repo)
        uses: actions/checkout@v4
        with:
          repository: KarotkiDzianis/shipClaudeDeploy
          ref: ${{ env.SHIP_REF }}
          path: platform/ship

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ship
        run: pip install -r platform/ship/requirements.txt

      - name: Download the exact artifact this release_id was approved for
        uses: actions/download-artifact@v4
        with:
          name: ship-artifact-${{ inputs.project_slug }}

      - name: Re-validate against the central registry (fail closed)
        run: |
          PYTHONPATH=platform/ship python3 -m shiplib.registry_check \
            --project "${{ inputs.project_slug }}" \
            --git-sha "${{ inputs.git_sha }}"

      - name: Install + verify + switch + restart + health (atomic, auto-rollback on any failure)
        run: |
          PYTHONPATH=platform/ship python3 platform/ship/deploy/run_deploy_cli.py \
            --project "${{ inputs.project_slug }}" \
            --repo "${{ github.repository }}" \
            --git-sha "${{ inputs.git_sha }}" \
            --artifact-sha256 "${{ inputs.artifact_sha256 }}" \
            --artifact-path ship-artifact-${{ inputs.project_slug }}/artifact.tar.gz \
            --project-dir .
          # Wraps shiplib.release.run_deploy() (built + tested, see
          # tests/test_release.py) with the project's OWN scripts/ship/
          # health as health_fn and a `systemctl restart <service>` (from
          # the registry-authorized service name only) as restart_fn.

      - name: Post deploy result (Telegram if configured, otherwise just logged; no-op either way, never fails the job)
        if: always()
        env:
          SHIP_TELEGRAM_BOT_TOKEN: ${{ secrets.SHIP_TELEGRAM_BOT_TOKEN }}
          SHIP_TELEGRAM_CHAT_ID: ${{ secrets.SHIP_TELEGRAM_CHAT_ID }}
        run: |
          PYTHONPATH=platform/ship python3 -m shiplib.deploy_result_cli \
            --project "${{ inputs.project_slug }}"
